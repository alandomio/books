title: "CHRONOS: Ai Confini dell'Impero — Dal Rinascimento alla Belle Époque, tra la Grande Storia e le Terre di Mezzo"
author: "Alan Domio"
lang: "sl"
description: "Dodici missioni nel tempo, dall'Umanesimo alla Belle Époque, raccontate da due cronoriporter: Alex segue la grande storia europea, Maja segue — con voce propria — la storia delle terre slovene. Un libro di storia per la seconda media che non lascia le periferie di confine come comparse mute."
